<!doctype html>
<html lang="vi" class="h-full bg-[#071716] text-[#f7f5ed]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tu Dưỡng - Đếm Số Lần Niệm Phật Bằng Giọng Nói AI</title>
    <meta name="description" content="Ứng dụng PWA hỗ trợ Phật tử tự động đếm số lần niệm Phật, Bồ Tát bằng micro điện thoại, chuông mõ thanh tịnh và quản lý mục tiêu tu tập." />
    
    <!-- OpenGraph & Social -->
    <meta property="og:title" content="Tu Dưỡng - Đếm Số Lần Niệm Phật Bằng Giọng Nói AI" />
    <meta property="og:description" content="Ứng dụng PWA hỗ trợ Phật tử tự động đếm số lần niệm Phật, Bồ Tát bằng micro điện thoại, chuông mõ thanh tịnh và quản lý mục tiêu tu tập." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web App meta tags with relative paths for GitHub Pages -->
    <meta name="theme-color" content="#071716" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tu Dưỡng" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    
    <!-- Google Fonts for Serene Vietnamese Buddhist Typography (100% full Vietnamese diacritics support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Charm:wght@400;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&subset=vietnamese&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Sacred classical serif font for Buddhist titles & Mantras - 100% Vietnamese support */
      .font-serif-sacred {
        font-family: 'Playfair Display', 'Lora', Georgia, serif;
      }
      /* Meditative, serene reading serif for sutras, mantras & meanings */
      .font-mantra {
        font-family: 'Lora', 'Playfair Display', Georgia, serif;
      }
      /* Sacred Buddhist temple calligraphy font for affirmations & blessings */
      .font-calligraphy {
        font-family: 'Charm', 'Lora', cursive, serif;
      }
      /* Tabular numbers for bead counters */
      .font-counter {
        font-family: 'Playfair Display', 'Be Vietnam Pro', serif;
        font-variant-numeric: tabular-nums;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 31, 30, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(218, 177, 95, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(218, 177, 95, 0.6);
      }
    </style>
  </head>
  <body class="h-full bg-[#071716] overflow-x-hidden antialiased selection:bg-[#dfb15b]/30 selection:text-[#faeed1]">
    <div id="root" class="h-full"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register service worker with relative path compatible with GitHub Pages subpath
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            const swUrl = new URL('sw.js', window.location.href).href;
            navigator.serviceWorker.register(swUrl).then(reg => {
              console.log('SW registered successfully:', reg.scope);
            }).catch(err => {
              console.warn('SW registration note:', err);
            });
          } catch (e) {
            console.warn('SW setup note:', e);
          }
        });
      }
    </script>
  </body>
</html>
